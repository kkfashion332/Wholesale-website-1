<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wholesale | Buy More Pay Less</title>
  
  <!-- Tailwind CSS for styling -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  
  <style>
    /* Aapka Animation CSS (Loader ke liye) */
    :root {
      --brand-sky: #4facfe; --brand-sun: #fbbf24; --brand-card: #ffffff;
      --brand-ink: #1e3a5f; --brand-line: #60a5fa;
      --gradient-glow: radial-gradient(circle at 50% 40%, rgba(96, 165, 250, 0.55), transparent 62%);
      --gradient-shine: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    }
    #loader-screen { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background-color: var(--brand-sky); overflow: hidden; transition: opacity 0.5s ease; }
    .glow { position: absolute; inset: 0; pointer-events: none; background: var(--gradient-glow); }
    .logo-card { position: relative; overflow: hidden; border-radius: 2rem; background-color: var(--brand-card); padding: 1.5rem; animation: pop-in 0.9s both; }
    .logo-card img { width: 150px; display: block; animation: float-soft 3.6s infinite; }
    .progress-bar { margin-top: 1.25rem; height: 0.375rem; width: 10rem; overflow: hidden; border-radius: 99px; background-color: var(--brand-line); }
    .progress-bar span { display: block; height: 100%; width: 33%; border-radius: 99px; background-color: var(--brand-sun); animation: slide-loop 2.2s infinite; }
    @keyframes pop-in { 0% { opacity: 0; transform: scale(0.7); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes float-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes slide-loop { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }

    /* Flipkart Bright Theme & Grid Layout CSS */
    #main-content { display: none; background-color: #f1f3f6; min-height: 100vh; }
    .flipkart-blue { background-color: #2874f0; }
    .flipkart-yellow { background-color: #ffe500; color: #212121; }
    
    /* Square Banner Setup */
    .banner-container { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; position: relative; background: #fff; }
    .banner-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease; object-fit: cover; }
    .banner-slide.active { opacity: 1; }

    /* 2 Vertical Rows, Infinite Horizontal Scroll Setup */
    .product-grid {
      display: grid;
      grid-template-rows: auto auto; /* 2 rows */
      grid-auto-flow: column; /* Items keep adding horizontally */
      grid-auto-columns: 160px; /* Width of each product card */
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 15px;
      scrollbar-width: thin;
    }
  </style>
</head>
<body>

  <!-- ANIMATED LOADER -->
  <div id="loader-screen">
    <div class="glow"></div>
    <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;">
      <div class="logo-card">
        <img src="logo.png" alt="Logo" />
      </div>
      <div class="progress-bar"><span></span></div>
    </div>
  </div>

  <!-- MAIN WEBSITE -->
  <div id="main-content">
    <!-- Header -->
    <header class="flipkart-blue text-white p-4 sticky top-0 z-50 shadow-md">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center space-x-2">
          <img src="logo.png" alt="Logo" class="h-8 bg-white p-1 rounded">
          <h1 class="text-xl font-bold italic">Wholesale<span class="text-yellow-300">Hub</span></h1>
        </div>
        <div>🛒 Login</div>
      </div>
      <!-- Search Bar -->
      <div class="flex bg-white rounded overflow-hidden shadow-sm">
        <input type="text" placeholder="Search for products..." class="w-full p-2 text-black outline-none">
      </div>
    </header>

    <!-- Auto Swipe Square Banners -->
    <div class="banner-container mt-2 shadow-sm" id="bannerBox">
      <!-- Banners will be injected here by app.js -->
    </div>

    <!-- Products Section -->
    <div class="mt-4 p-2 bg-white shadow-sm">
      <h2 class="text-lg font-bold mb-3 border-b pb-2">Deal of the Day</h2>
      
      <!-- Horizontal Scroll Grid (2 Rows) -->
      <div class="product-grid" id="productBox">
        <!-- Products will be injected here by app.js -->
      </div>
    </div>
  </div>

  <!-- YAHAN CHANGE KIYA HAI: type="module" add kar diya -->
  <script type="module" src="app.js"></script>
</body>
</html>
